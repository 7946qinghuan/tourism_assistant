[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism_assistant"
version = "0.1.0"
description = "Tourism Assistant SDK"
requires-python = ">=3.11"
dependencies = [
    "camel-ai>=0.2.80",
    "fastapi>=0.125.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tourism_assistant*"]
